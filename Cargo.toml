[package]
name = "lau-information-geometry-agents"
version = "0.1.0"
edition = "2021"
description = "Information geometry for agent belief spaces: Fisher metric, geodesics, natural gradient, and Amari's dual connections"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-information-geometry-agents"
keywords = ["information-geometry", "fisher-metric", "natural-gradient", "agent-learning", "manifold"]
categories = ["mathematics", "science"]

[dependencies]
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"
